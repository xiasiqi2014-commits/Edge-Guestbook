<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Guestbook 🌍</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --secondary-text: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--secondary-text);
        }

        .input-area {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: var(--bg-color);
            border: 1px solid #334155;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-card {
            background-color: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            border-left: 4px solid var(--accent-color);
            animation: fadeIn 0.3s ease-in-out;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--secondary-text);
        }

        .location-badge {
            background-color: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .message-text {
            font-size: 1.1rem;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Spinner */
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--accent-color);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Global Guestbook</h1>
            <p class="subtitle">Powered by Cloudflare Workers (Python) & Pages</p>
        </header>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Say hello to the world..." autocomplete="off">
            <button id="sendBtn" onclick="postMessage()">
                <span id="btnText">Send</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </div>

        <div class="message-list" id="messageList">
            <!-- Messages will appear here -->
            <div style="text-align: center; color: gray;">Loading messages...</div>
        </div>
    </div>

    <script>
        // Configuration: Production Cloudflare Worker
        const API_URL = "https://cloudflare-worker-test.xiasiqi2014.workers.dev/api/guestbook";

        async function fetchMessages() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Failed to fetch");
                const messages = await response.json();
                renderMessages(messages);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("messageList").innerHTML =
                    '<div style="text-align: center; color: #ef4444;">Failed to connect to Worker Backend.<br>Make sure `uv run pywrangler dev` is running!</div>';
            }
        }

        async function postMessage() {
            const input = document.getElementById("messageInput");
            const btn = document.getElementById("sendBtn");
            const btnText = document.getElementById("btnText");
            const spinner = document.getElementById("btnSpinner");
            const text = input.value.trim();

            if (!text) return;

            // UI Loading State
            input.disabled = true;
            btn.disabled = true;
            btnText.style.display = "none";
            spinner.style.display = "block";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                if (response.ok) {
                    input.value = "";
                    await fetchMessages(); // Refresh list
                } else {
                    alert("Error posting message");
                }
            } catch (e) {
                alert("Network error: " + e.message);
            } finally {
                // Restore UI
                input.disabled = false;
                btn.disabled = false;
                btnText.style.display = "block";
                spinner.style.display = "none";
                input.focus();
            }
        }

        function renderMessages(messages) {
            const list = document.getElementById("messageList");
            list.innerHTML = "";

            if (messages.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: gray;">No messages yet. Be the first!</div>';
                return;
            }

            messages.forEach(msg => {
                const card = document.createElement("div");
                card.className = "message-card";

                // Format timestamp
                const time = new Date(msg.timestamp).toLocaleTimeString();

                card.innerHTML = `
                    <div class="message-header">
                        <span>#${msg.id} • ${time}</span>
                        <div class="location-badge">
                            <span>📍</span> ${msg.location}
                        </div>
                    </div>
                    <div class="message-text">${escapeHtml(msg.text)}</div>
                `;
                list.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial fetch
        fetchMessages();

        // Allow Enter key to submit
        document.getElementById("messageInput").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                postMessage();
            }
        });
    </script>
</body>

</html>
